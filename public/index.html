<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#10153A">
  <title>Путь в Kaspi — план Java-разработчика</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%2310153A'/><circle cx='50' cy='50' r='30' fill='none' stroke='%23F1453D' stroke-width='10' stroke-linecap='round' stroke-dasharray='120 200' transform='rotate(-90 50 50)'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/today" aria-label="На главную">
      <span class="brand-mark"><span></span></span>
      <span class="brand-text">Путь в Kaspi</span>
    </a>
    <nav class="nav" id="nav">
      <a class="pill" data-route="today" href="#/today">Сегодня</a>
      <a class="pill" data-route="week" href="#/week">Неделя</a>
      <a class="pill" data-route="plan" href="#/plan">План</a>
      <a class="pill" data-route="lc" href="#/lc">LeetCode</a>
      <a class="pill round-only" data-route="settings" href="#/settings" aria-label="Настройки">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </a>
    </nav>
    <button class="sync" id="sync" type="button" title="Синхронизация"><span class="sync-dot"></span><span class="sync-label">…</span></button>
  </header>

  <main id="app" class="app" tabindex="-1"></main>

  <div class="modal" id="modal" hidden>
    <form class="modal-card" id="pwForm">
      <h2>Введи пароль</h2>
      <p>Сайт защищён паролем, чтобы никто, кроме тебя, не менял прогресс.</p>
      <input class="field" id="pwInput" type="password" autocomplete="current-password" placeholder="Пароль из APP_PASSWORD" required>
      <div class="row">
        <button class="btn ghost" type="button" id="pwLater">Позже</button>
        <button class="btn primary" type="submit">Войти</button>
      </div>
    </form>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/plan.js"></script>
  <script src="/app.js"></script>
</body>
</html>
